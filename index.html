<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Finder</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main>
      <h1>Word Finder</h1>

      <div id="file-protocol-warning" class="file-protocol-warning" role="alert" hidden></div>

      <section id="start-screen" class="screen">
        <form id="start-form">
          <fieldset class="field grid-size-field">
            <legend>Grid size</legend>
            <div id="grid-size-choices" class="choice-list grid-size-choices"></div>
          </fieldset>

          <fieldset class="field theme-field">
            <legend>Theme</legend>
            <div id="theme-choices" class="choice-list theme-choices"></div>
          </fieldset>

          <div class="word-count-field">
            <label for="word-count">Number of words</label>
            <input type="number" id="word-count" min="1" value="10" />
          </div>

          <button id="start-button" type="submit">Start</button>
        </form>
      </section>

      <section id="puzzle-screen" class="screen" hidden>
        <div class="puzzle-header">
          <p class="theme">Theme: <span id="theme-label"></span></p>
          <p class="timer" role="timer">Time: <span id="timer-label">0:00</span></p>
          <button id="new-puzzle-button" type="button">New Puzzle</button>
        </div>

        <div id="win-banner" class="win-banner" role="status" hidden>
          You found every word! Puzzle complete.
          <span id="score-label" class="score-label"></span>
        </div>

        <div class="puzzle-layout">
          <div id="grid" class="grid" role="grid" aria-label="Word search grid"></div>

          <aside class="word-panel">
            <h2>Find these words</h2>
            <ul id="word-list" class="word-list"></ul>
          </aside>
        </div>
      </section>
    </main>

    <script src="js/file-protocol-warning.js"></script>
    <script>
      // Plain classic script, deliberately not `type="module"`: browsers
      // block ES module loading over file://, which is exactly the
      // condition this needs to survive in order to report. The decision
      // itself (and its message text) lives in js/file-protocol-warning.js,
      // loaded just above as a classic script too so it can run here; this
      // is just a thin caller applying its result to the DOM — untested,
      // per this repo's existing UI-layer convention (see ui.js's header
      // comment).
      var message = window.fileProtocolWarning(window.location.protocol);
      if (message) {
        var warning = document.getElementById('file-protocol-warning');
        if (warning) {
          warning.textContent = message;
          warning.hidden = false;
        }
        var startScreen = document.getElementById('start-screen');
        if (startScreen) startScreen.hidden = true;
      }
    </script>
    <script type="module" src="js/ui.js"></script>
  </body>
</html>
